name: Bravi web validation

on:
  pull_request:
    paths:
      - "apps/bravi-web/**"
      - ".github/workflows/bravi-web-validation.yml"
      - "docs/BRAVI_WEB_V0_6.md"
  push:
    branches:
      - "feat/**"
    paths:
      - "apps/bravi-web/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bravi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/bravi-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:http
      - run: npm run verify:production
